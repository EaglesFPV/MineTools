"use strict";

/* ── Worker via Blob URL (fonctionne avec file://) ── */
var WORKER_CODE = `/**
 * MineGuide — minecraft.js v5
 * Moteur biomes Java Edition 1.16–1.21.4
 * ValueNoise avec MurmurHash3 pour seeding rapide
 */
"use strict";

/* ────── Java LCG (structures uniquement) ────── */
function jrSeed(s){return(BigInt(s)^0x5DEECE66Dn)&((1n<<48n)-1n);}
function jrNext(s){return(s*0x5DEECE66Dn+0xBn)&((1n<<48n)-1n);}
function jrInt(s,n){let b,v,ns=s;do{ns=jrNext(ns);b=Number(ns>>17n);v=b%n;}while(b-v+(n-1)<0);return[ns,v];}

/* ────── MurmurHash3 fmix32 — seed mixing ultra-rapide ────── */
function fmix(h){h=Math.imul(h^(h>>>16),0x85ebca6b)|0;h=Math.imul(h^(h>>>13),0xc2b2ae35)|0;return h^(h>>>16);}

/* ────── Value Noise 2D seédé par MurmurHash3 ────── */
class ValueNoise{
  constructor(seed){
    const s=fmix(seed|0);
    this.p=new Uint8Array(512);
    // Génère la table de permutation avec LCG simple (entiers 32-bit)
    let r=fmix(s);
    const perm=new Uint8Array(256);
    for(let i=0;i<256;i++)perm[i]=i;
    for(let i=255;i>0;i--){r=Math.imul(r,1664525)+1013904223|0;const j=((r>>>1)%(i+1)+i+1)%(i+1);const t=perm[i];perm[i]=perm[j];perm[j]=t;}
    for(let i=0;i<256;i++)this.p[i]=this.p[i+256]=perm[i];
    // Table de valeurs aléatoires [0,1]
    this.v=new Float32Array(512);
    r=fmix(s^0xDEADBEEF);
    for(let i=0;i<256;i++){r=Math.imul(r,1664525)+1013904223|0;this.v[i]=this.v[i+256]=((r>>>1)&0x7FFFFF)/8388607;}
  }
  _f(t){return t*t*t*(t*(t*6-15)+10);}
  _r(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    const xf=x-Math.floor(x),yf=y-Math.floor(y);
    const u=this._f(xf),v=this._f(yf);
    const p=this.p,val=this.v;
    const aa=val[p[p[X]+Y]],ba=val[p[p[(X+1)&255]+Y]];
    const ab=val[p[p[X]+((Y+1)&255)]],bb=val[p[p[(X+1)&255]+((Y+1)&255)]];
    return aa+u*(ba-aa)+v*(ab+u*(bb-ab));
  }
  fbm(x,y,oct,lac,per){
    let v=0,a=1,f=1,m=0;
    for(let o=0;o<oct;o++){v+=this._r(x*f,y*f)*a;m+=a;a*=per;f*=lac;}
    return(v/m)*2-1;
  }
}

const CT={T0:-0.45,T1:-0.15,T2:0.2,T3:0.55};
const CH={H0:-0.35,H1:-0.1,H2:0.1,H3:0.3};
const CC={DEEP:-0.45,OCEAN:-0.19,COAST:-0.11,NEAR:0.03,INLAND:0.3};
const CE={E0:-0.78,E1:-0.375,E2:-0.22,E3:0.05,E4:0.45};
function TI(t){return t<CT.T0?0:t<CT.T1?1:t<CT.T2?2:t<CT.T3?3:4;}
function HI(h){return h<CH.H0?0:h<CH.H1?1:h<CH.H2?2:h<CH.H3?3:4;}

const BM=[
  ['snowy_plains','snowy_plains','snowy_plains','snowy_taiga','taiga'],
  ['plains','plains','forest','taiga','old_growth_spruce_taiga'],
  ['sunflower_plains','flower_forest','forest','birch_forest','dark_forest'],
  ['savanna','savanna','forest','jungle','jungle'],
  ['desert','desert','savanna','jungle','bamboo_jungle'],
];
const BH=[
  ['snowy_plains','snowy_plains','snowy_plains','snowy_taiga','taiga'],
  ['plains','plains','forest','taiga','taiga'],
  ['flower_forest','plains','forest','birch_forest','dark_forest'],
  ['savanna_plateau','savanna_plateau','forest','forest','jungle'],
  ['badlands','badlands','wooded_badlands','wooded_badlands','bamboo_jungle'],
];
const BE=[
  ['snowy_plains','snowy_plains','snowy_plains','snowy_taiga','taiga'],
  ['plains','plains','plains','taiga','taiga'],
  ['plains','plains','plains','old_growth_birch_forest','old_growth_birch_forest'],
  ['savanna','savanna','plains','jungle','jungle'],
  ['desert','desert','desert','desert','jungle'],
];
const BV=[
  ['ice_spikes','snowy_plains','snowy_plains','snowy_taiga','old_growth_pine_taiga'],
  ['plains','plains','plains','old_growth_pine_taiga','old_growth_spruce_taiga'],
  ['plains','flower_forest','forest','old_growth_birch_forest','old_growth_birch_forest'],
  ['savanna','savanna','jungle','jungle','sparse_jungle'],
  ['desert','desert','desert','wooded_badlands','eroded_badlands'],
];

function biome18(temp,hum,cont,eros,weird,rv,version){
  const T=TI(temp),H=HI(hum);
  const cherry=version>='1.20';
  const mang=version>='1.19';
  if(Math.abs(rv)<0.016)return temp<CT.T0?'frozen_river':'river';
  if(cont<CC.DEEP){
    if(temp<CT.T0)return'deep_frozen_ocean';if(temp<CT.T1)return'deep_cold_ocean';
    if(temp>CT.T3)return'deep_lukewarm_ocean';return'deep_ocean';
  }
  if(cont<CC.OCEAN){
    if(temp<CT.T0)return'frozen_ocean';if(temp<CT.T1)return'cold_ocean';
    if(temp>CT.T3)return'warm_ocean';if(temp>CT.T2)return'lukewarm_ocean';return'ocean';
  }
  if(cont<CC.COAST){
    if(temp<CT.T0)return'snowy_beach';if(eros>CE.E4)return'stony_shore';return'beach';
  }
  if(cont>CC.INLAND&&eros<CE.E1){
    if(eros<CE.E0){if(temp<CT.T0)return'jagged_peaks';if(temp<CT.T1)return'frozen_peaks';return'stony_peaks';}
    if(temp<CT.T1)return'snowy_slopes';
    if(cherry&&hum>CH.H2&&weird>0.3)return'cherry_grove';
    return hum>CH.H2?'grove':'windswept_hills';
  }
  if(cont>CC.NEAR&&eros<CE.E2&&cont>0.4){
    if(hum>CH.H2)return'windswept_forest';return'windswept_hills';
  }
  if(eros>CE.E4&&cont>CC.NEAR&&temp>CT.T0&&temp<CT.T3){
    if(cherry&&hum>CH.H2&&weird>0.2)return'cherry_grove';return'meadow';
  }
  if(temp>CT.T3&&hum<CH.H0){
    if(weird>0.4)return'eroded_badlands';if(eros<CE.E2)return'wooded_badlands';return'badlands';
  }
  if(hum>CH.H3&&temp>CT.T0&&temp<CT.T3&&eros>CE.E3){
    return(mang&&temp>CT.T2)?'mangrove_swamp':'swamp';
  }
  if(hum>CH.H3&&temp>CT.T0&&temp<CT.T3&&eros>CE.E2&&weird<-0.3)return'dark_forest';
  if(eros>CE.E4)return BE[T][H];
  if(eros>CE.E3)return(weird>0.4?BV:BM)[T][H];
  if(eros>CE.E2)return BM[T][H];
  return BH[T][H];
}

function makeNewBiomeGen(worldSeed,version){
  const ws=fmix(worldSeed|0);
  const nT=new ValueNoise(fmix(ws^0x1A2B3C)),nH=new ValueNoise(fmix(ws^0x4D5E6F));
  const nC=new ValueNoise(fmix(ws^0x7A8B9C)),nE=new ValueNoise(fmix(ws^0xD1E2F3));
  const nW=new ValueNoise(fmix(ws^0x456789)),nR=new ValueNoise(fmix(ws^0xABCDEF));
  return function(wx,wz){
    const temp =nT.fbm(wx/2500,wz/2500,3,2,0.5);
    const hum  =nH.fbm(wx/1600,wz/1600,3,2,0.5);
    const cont =nC.fbm(wx/5500,wz/5500,4,2,0.48);
    const eros =nE.fbm(wx/2200,wz/2200,3,2,0.5);
    const weird=nW.fbm(wx/900, wz/900, 3,2,0.5);
    const rv   =nR.fbm(wx/280, wz/280, 3,2,0.5);
    return biome18(temp,hum,cont,eros,weird,rv,version);
  };
}

function makeLegacyBiomeGen(worldSeed){
  const ws=fmix(worldSeed|0);
  const nC=new ValueNoise(fmix(ws^0xA1B2C3)),nT=new ValueNoise(fmix(ws^0x1F2E3D));
  const nR=new ValueNoise(fmix(ws^0x5A6B7C)),nH=new ValueNoise(fmix(ws^0xC9D8E7));
  const nRv=new ValueNoise(fmix(ws^0x112233)),nV=new ValueNoise(fmix(ws^0x99AABB));
  const LAND=[['snowy_plains','snowy_taiga'],['plains','taiga'],['forest','forest'],['savanna','jungle'],['desert','desert']];
  const HILLS=[['snowy_plains','snowy_taiga'],['gravelly_mountains','old_growth_spruce_taiga'],['wooded_mountains','birch_forest'],['savanna_plateau','bamboo_jungle'],['badlands','wooded_badlands']];
  return function(wx,wz){
    const cont=nC.fbm(wx/5200,wz/5200,4,2,0.48),temp=nT.fbm(wx/3100,wz/3100,3,2,0.5);
    const rain=nR.fbm(wx/2600,wz/2600,3,2,0.5),hill=nH.fbm(wx/850,wz/850,3,2,0.45);
    const rv=nRv.fbm(wx/270,wz/270,3,2,0.5),vari=nV.fbm(wx/210,wz/210,2,2,0.5);
    if(cont<-0.10){
      const d=cont<-0.40;
      if(temp<-0.70)return d?'deep_frozen_ocean':'frozen_ocean';
      if(temp<-0.20)return d?'deep_cold_ocean':'cold_ocean';
      if(temp>0.60)return d?'deep_lukewarm_ocean':'lukewarm_ocean';
      if(temp>0.80)return d?'deep_lukewarm_ocean':'warm_ocean';
      return d?'deep_ocean':'ocean';
    }
    if(cont<0.0){if(temp<-0.70)return'snowy_beach';if(hill>0.44)return'stony_shore';return'beach';}
    if(Math.abs(rv)<0.022)return temp<-0.64?'frozen_river':'river';
    if(cont>0.50&&hill>0.76&&temp>-0.20&&temp<0.30)return'mushroom_fields';
    if(vari>0.50&&temp>-0.10&&temp<0.20&&rain>0.20)return'flower_forest';
    const ti=Math.min(4,Math.floor((temp+1)*2.5)),ri=rain>0?1:0;
    if(hill>0.46)return HILLS[ti][ri];
    return LAND[ti][ri];
  };
}

function _sh(ws,n=3){

"use strict";
var biomeGen = null;

/* Tile cache in worker (avoids duplicate compute) */
var tileCache = new Map();

function makeTile(tileX, tileZ, tileSz, px) {
  if (!biomeGen) return null;
  var key = tileX + '|' + tileZ + '|' + tileSz;
  var cached = tileCache.get(key);
  if (cached) return cached;
  var bpt = tileSz / px;
  var buf = new Uint8ClampedArray(px * px * 4);
  var MC = self.MC;
  for (var py = 0; py < px; py++) {
    for (var ppx = 0; ppx < px; ppx++) {
      var wx = tileX + ppx * bpt;
      var wz = tileZ + py  * bpt;
      var biome = biomeGen(wx, wz);
      var rgb = MC.getBiomeColor(biome);
      var i = (py * px + ppx) * 4;
      buf[i]   = rgb[0];
      buf[i+1] = rgb[1];
      buf[i+2] = rgb[2];
      buf[i+3] = 255;
    }
  }
  if (tileCache.size > 800) {
    tileCache.delete(tileCache.keys().next().value);
  }
  tileCache.set(key, buf);
  return buf;
}

self.onmessage = function(e) {
  var msg = e.data;
  var MC = self.MC;

  if (msg.type === 'init') {
    var seed = msg.seed;
    var version = msg.version;
    tileCache.clear();
    biomeGen = MC.isNewGen(version)
      ? MC.makeNewBiomeGen(seed, version)
      : MC.makeLegacyBiomeGen(seed);
    /* Structures */
    var structs = MC.getStructuresInRadius(seed, version, 26000);
    postMessage({ type: 'ready', structs: structs });
    return;
  }

  if (msg.type === 'tile') {
    var rgba = makeTile(msg.tileX, msg.tileZ, msg.tileSz, msg.px);
    var copy = rgba ? rgba.slice() : null;
    postMessage(
      { type: 'tile', id: msg.id, rgba: copy, px: msg.px },
      copy ? [copy.buffer] : []
    );
    return;
  }
};

var _workerBlob = new Blob([WORKER_CODE], {type:'application/javascript'});

var seed=0, version='1.21.4', zoom=4, camX=0, camZ=0, showGrid=false;

var worker=null, workerReady=false;
var tileCache=new Map();     // clé → Uint8ClampedArray
var tileQueue=[];            // requêtes en attente
var inFlight=new Map();      // id → clé
var inFlightCount=0, nextId=0;
var MAX_INFLIGHT=6;

const TILE=64;
const _oc=document.createElement('canvas'); _oc.width=_oc.height=TILE;

/* ── Init ── */
function init(){
  var sel=document.getElementById('versionSelect');
  MC.VERSION_LIST.forEach(function(v){
    var o=document.createElement('option');
    o.value=v.value; o.textContent=v.label;
    if(v.value==='1.21.4') o.selected=true;
    sel.appendChild(o);
  });
  version='1.21.4';
  sel.addEventListener('change',function(){version=sel.value;});
  resize(); window.addEventListener('resize',function(){resize();sched();});
  var p=new URLSearchParams(location.search);
  if(p.get('seed')){
    document.getElementById('seedInput').value=p.get('seed');
    if(p.get('v')){version=p.get('v');sel.value=version;}
  }
  var wrap=document.getElementById('map-wrap');
  wrap.addEventListener('mousedown',onMD);
  wrap.addEventListener('mousemove',onMM);
  wrap.addEventListener('mouseup',function(){dragging=false;});
  wrap.addEventListener('mouseleave',function(){dragging=false;hideTT();});
  wrap.addEventListener('wheel',onWh,{passive:false});
  wrap.addEventListener('contextmenu',function(e){e.preventDefault();});
  // Touch
  var pinchDist=0;
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===2) pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    else if(e.touches.length===1){dragging=true;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;}
  },{passive:true});
  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      setZoom(zoom*(pinchDist/d)); pinchDist=d;
    } else if(e.touches.length===1&&dragging){
      camX-=(e.touches[0].clientX-lastMX)*zoom; camZ-=(e.touches[0].clientY-lastMY)*zoom;
      lastMX=e.touches[0].clientX; lastMY=e.touches[0].clientY; sched();
    }
  },{passive:true});
  wrap.addEventListener('touchend',function(){dragging=false;});
  document.getElementById('seedInput').addEventListener('keydown',function(e){if(e.key==='Enter')loadMap();});
  document.getElementById('gotoX').addEventListener('keydown',function(e){if(e.key==='Enter')gotoCoords();});
  document.getElementById('gotoZ').addEventListener('keydown',function(e){if(e.key==='Enter')gotoCoords();});
  spawnWorker();
  var p2=new URLSearchParams(location.search);
  if(p2.get('seed')) loadMap();
}

/* ── Worker ── */
function spawnWorker(){
  if(worker) worker.terminate();
  worker=new Worker(_workerURL);
  worker.onmessage=onWorkerMsg;
  worker.onerror=function(e){console.error('Worker error:',e);};
  workerReady=false;
}

function onWorkerMsg(e){
  var msg=e.data;
  if(msg.type==='ready'){
    workerReady=true;
    // Structures
    structData=msg.structs||{};
    buildStructBar();
    document.getElementById('empty-state').style.display='none';
    document.getElementById('struct-bar').style.display='flex';
    resetView();
    return;
  }
  if(msg.type==='tile'){
    inFlightCount--;
    var key=inFlight.get(msg.id);
    inFlight.delete(msg.id);
    if(msg.rgba&&key){
      tileCache.set(key,msg.rgba);
    }
    pumpQueue();
    sched();
    return;
  }
}

/* ── Load Map ── */
function loadMap(){
  var raw=document.getElementById('seedInput').value.trim();
  if(!raw)return;
  var parsed=MC.parseSeed(raw);
  if(parsed===null)return;
  seed=parsed;
  version=document.getElementById('versionSelect').value;
  tileCache.clear(); tileQueue=[]; inFlight.clear(); inFlightCount=0;
  structData={}; visStructs=new Set();
  document.getElementById('struct-bar').style.display='none';
  var W=cW(),H=cH();
  ['mapCanvas','structCanvas'].forEach(function(id){
    document.getElementById(id).getContext('2d').clearRect(0,0,W,H);
  });
  document.getElementById('rs').style.display='flex';
  spawnWorker();
  // Wait for worker to be ready then send init
  worker.onmessage=function(e){
    if(e.data.type==='tile'){ onWorkerMsg(e); return; }
    if(e.data.type==='ready'){ onWorkerMsg(e); return; }
  };
  worker.postMessage({type:'init', seed:seed, version:version});
  history.replaceState(null,'','?seed='+encodeURIComponent(raw)+'&v='+version);
}

/* ── Tile Queue ── */
function requestTile(key,tx,tz,tb){
  tileQueue.push({key:key,tileX:tx,tileZ:tz,tileSz:tb});
  pumpQueue();
}

function pumpQueue(){
  while(inFlightCount<MAX_INFLIGHT&&tileQueue.length>0){
    var req=tileQueue.shift();
    if(tileCache.has(req.key)) continue;
    var id=nextId++;
    inFlight.set(id,req.key);
    inFlightCount++;
    worker.postMessage({type:'tile',id:id,tileX:req.tileX,tileZ:req.tileZ,tileSz:req.tileSz,px:TILE});
  }
}

/* ── Canvas ── */
function resize(){
  var wrap=document.getElementById('map-wrap');
  var W=wrap.clientWidth,H=wrap.clientHeight;
  ['mapCanvas','structCanvas'].forEach(function(id){
    var c=document.getElementById(id); c.width=W; c.height=H;
  });
}
function cW(){return document.getElementById('mapCanvas').width;}
function cH(){return document.getElementById('mapCanvas').height;}
function w2s(wx,wz){return{x:(wx-camX)/zoom+cW()/2,y:(wz-camZ)/zoom+cH()/2};}
function s2w(sx,sy){return{x:(sx-cW()/2)*zoom+camX,z:(sy-cH()/2)*zoom+camZ};}
function resetView(){camX=0;camZ=0;setZoom(4);}

function setZoom(z){
  zoom=Math.max(0.25,Math.min(128,z));
  var lbl=zoom>=1?'1/'+Math.round(zoom)+'\u00d7':+(1/zoom).toFixed(1)+'\u00d7';
  document.getElementById('zoomLabel').textContent=lbl;
  tileCache.clear(); tileQueue=[];
  sched();
}
function adjustZoom(f){setZoom(zoom*f);}

function sched(){if(raf)return;raf=requestAnimationFrame(render);}

function render(){
  raf=null;
  if(!workerReady)return;
  var W=cW(),H=cH();
  var ctx=document.getElementById('mapCanvas').getContext('2d');
  ctx.clearRect(0,0,W,H);
  var tb=Math.max(1,Math.pow(2,Math.round(Math.log2(zoom*TILE))));
  var tl=s2w(0,0),br=s2w(W,H);
  var txS=Math.floor(tl.x/tb),txE=Math.ceil(br.x/tb);
  var tzS=Math.floor(tl.z/tb),tzE=Math.ceil(br.z/tb);
  ctx.imageSmoothingEnabled=false;
  var hasPending=false;
  var queuedKeys=new Set(tileQueue.map(function(r){return r.key;}));
  inFlight.forEach(function(k){queuedKeys.add(k);});
  for(var tz=tzS;tz<=tzE;tz++){
    for(var tx=txS;tx<=txE;tx++){
      var key=tx+'|'+tz+'|'+tb;
      var rgba=tileCache.get(key);
      if(!rgba){
        if(!queuedKeys.has(key)){requestTile(key,tx*tb,tz*tb,tb);queuedKeys.add(key);}
        hasPending=true; continue;
      }
      var imgd=new ImageData(rgba.slice(),TILE,TILE);
      _octx.putImageData(imgd,0,0);
      var p=w2s(tx*tb,tz*tb),sz=Math.ceil(TILE*tb/zoom);
      ctx.drawImage(_oc,Math.round(p.x),Math.round(p.y),sz,sz);
    }
  }
  if(showGrid) drawGrid(ctx,W,H);
  drawStructures();
  var rs=document.getElementById('rs');
  if(hasPending||inFlightCount>0){rs.style.display='flex';raf=requestAnimationFrame(render);}
  else rs.style.display='none';
}

/* ── Grid ── */
function drawGrid(ctx,W,H){
  ctx.save();
  var cpx=16/zoom;
  if(cpx>5){
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5;
    var tl=s2w(0,0),sx0=Math.floor(tl.x/16)*16,sz0=Math.floor(tl.z/16)*16;
    for(var cx=sx0;cx<tl.x+W*zoom;cx+=16){var p=w2s(cx,0);ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,H);ctx.stroke();}
    for(var cz=sz0;cz<tl.z+H*zoom;cz+=16){var p=w2s(0,cz);ctx.beginPath();ctx.moveTo(0,p.y);ctx.lineTo(W,p.y);ctx.stroke();}
  }
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  var tl2=s2w(0,0),rx0=Math.floor(tl2.x/512)*512,rz0=Math.floor(tl2.z/512)*512;
  for(var rx=rx0;rx<tl2.x+W*zoom;rx+=512){var p=w2s(rx,0);ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,H);ctx.stroke();}
  for(var rz=rz0;rz<tl2.z+H*zoom;rz+=512){var p=w2s(0,rz);ctx.beginPath();ctx.moveTo(0,p.y);ctx.lineTo(W,p.y);ctx.stroke();}
  ctx.restore();
}

/* ── Structures ── */

function toggleStruct(id,btn){

function drawStructures(){
  var canvas=document.getElementById('structCanvas');
  var ctx=canvas.getContext('2d');
  var W=cW(),H=cH();
  ctx.clearRect(0,0,W,H);
  for(var id in structData){
    if(!visStructs.has(id))continue;
    var entry=structData[id];
    var cfg=entry.cfg;
    for(var i=0;i<entry.positions.length;i++){
      var pos=entry.positions[i];
      var sp=w2s(pos.x,pos.z);
      var sx=sp.x,sy=sp.y;
      if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;
      var r=Math.max(5,Math.min(14,9/Math.max(.1,zoom*.08)));
      ctx.beginPath();ctx.arc(sx,sy,r+2,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fill();
      ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fillStyle=cfg.color+'22';ctx.fill();
      ctx.strokeStyle=cfg.color;ctx.lineWidth=1.5;ctx.stroke();
      if(r>=6){ctx.font=Math.min(12,r*1.2)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=cfg.color;ctx.fillText(cfg.icon,sx,sy);}
      if(zoom<8){ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='8px Nunito';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(pos.x+','+pos.z,sx,sy+r+2);}
    }
  }
}

/* ── Events ── */
function onMD(e){if(e.button!==0)return;dragging=true;lastMX=e.clientX;lastMY=e.clientY;}

function onMM(e){
  var rect=document.getElementById('map-wrap').getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  if(dragging){
    camX-=(e.clientX-lastMX)*zoom;camZ-=(e.clientY-lastMY)*zoom;
    lastMX=e.clientX;lastMY=e.clientY;sched();hideTT();return;
  }
  var w=s2w(mx,my);
  document.getElementById('coords-display').textContent='X: '+Math.round(w.x)+'  Z: '+Math.round(w.z);
  // Biome under cursor (from tile cache)
  var tb=Math.max(1,Math.pow(2,Math.round(Math.log2(zoom*TILE))));
  var tx=Math.floor(w.x/tb),tz=Math.floor(w.z/tb);
  var key=tx+'|'+tz+'|'+tb;
  var rgba=tileCache.get(key);
  if(rgba){
    var lx=Math.min(TILE-1,Math.max(0,Math.floor((w.x-tx*tb)/tb*TILE)));
    var lz=Math.min(TILE-1,Math.max(0,Math.floor((w.z-tz*tb)/tb*TILE)));

    var r=rgba[idx],g=rgba[idx+1],b=rgba[idx+2];

    for(var i=0;i<entry.positions.length;i++){
      var pos=entry.positions[i];
      var sp=w2s(pos.x,pos.z);
      if(Math.hypot(mx-sp.x,my-sp.y)<14){showTT(entry.cfg.name,pos.x,pos.z,e.clientX,e.clientY,rect);return;}
    }
  }
  hideTT();
}

/* Lookup table couleur → nom FR (construit une fois) */
var _colorMap=null;
function getColorMap(){
  if(_colorMap)return _colorMap;
  _colorMap={};
  for(var name in MC.BIOME_COLOR){
    var rgb=MC.BIOME_COLOR[name];
    var key2=rgb[0]+'|'+rgb[1]+'|'+rgb[2];
    _colorMap[key2]=MC.BIOME_FR[name]||name;
  }
  return _colorMap;
}
function rgbToBiomeName(r,g,b){
  var cm=getColorMap();
  var k=r+'|'+g+'|'+b;
  if(cm[k])return cm[k];
  // Nearest color search
  var best='\u2014',bestD=999999;
  for(var key in cm){
    var parts=key.split('|');
    var dr=r-+parts[0],dg=g-+parts[1],db=b-+parts[2];
    var d=dr*dr+dg*dg+db*db;
    if(d<bestD){bestD=d;best=cm[key];}
  }
  return best;
}

function showTT(name,x,z,cx,cy,rect){
  var tt=document.getElementById('tooltip');
  document.getElementById('ttName').textContent=name;
  document.getElementById('ttCoord').textContent='X: '+x+'  Z: '+z;
  tt.style.display='block';
  var l=cx-rect.left+14,t=cy-rect.top+14;
  if(l+170>rect.width)l=cx-rect.left-170;
  if(t+50>rect.height)t=cy-rect.top-50;
  tt.style.left=l+'px';tt.style.top=t+'px';
}
function hideTT(){document.getElementById('tooltip').style.display='none';}

function onWh(e){
  e.preventDefault();
  var f=e.deltaY>0?1.18:1/1.18;
  var rect=document.getElementById('map-wrap').getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var ww=s2w(mx,my);
  zoom=Math.max(0.25,Math.min(128,zoom*f));
  document.getElementById('zoomLabel').textContent=zoom>=1?'1/'+Math.round(zoom)+'\u00d7':+(1/zoom).toFixed(1)+'\u00d7';
  camX=ww.x-(mx-cW()/2)*zoom;camZ=ww.z-(my-cH()/2)*zoom;
  tileCache.clear();tileQueue=[];sched();
}

/* ── UI ── */
function toggleGrid(){showGrid=!showGrid;document.getElementById('btnGrid').classList.toggle('active',showGrid);sched();}

function toggleLegend(){
  var el=document.getElementById('biome-legend');
  el.classList.toggle('visible');
  document.getElementById('btnLegend').classList.toggle('active',el.classList.contains('visible'));
  if(el.classList.contains('visible')&&!el.dataset.built){
    el.dataset.built='1';
    var html='';
    for(var name in MC.BIOME_COLOR){
      var rgb=MC.BIOME_COLOR[name];
      html+='<div class="bl-item"><div class="bl-swatch" style="background:rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')"></div><div class="bl-name">'+(MC.BIOME_FR[name]||name)+'</div></div>';
    }
    document.getElementById('legendItems').innerHTML=html;
  }
}

function gotoCoords(){
  camX=parseFloat(document.getElementById('gotoX').value)||0;
  camZ=parseFloat(document.getElementById('gotoZ').value)||0;
  tileCache.clear();tileQueue=[];sched();
}

function shareLink(){
  var raw=document.getElementById('seedInput').value.trim();
  if(!raw)return;
  history.replaceState(null,'','?seed='+encodeURIComponent(raw)+'&v='+version);
  navigator.clipboard&&navigator.clipboard.writeText(location.href).then(function(){MineGuide&&MineGuide.showToast&&MineGuide.showToast('Lien copié !','success');});
}

init();
</script>
</body>
</html>
